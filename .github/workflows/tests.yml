name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: sudo apt-get update && sudo apt-get install -y lua5.1 lua-check php-cli
      - name: Tests hors jeu
        run: TZ=Europe/Paris lua5.1 tests/run.lua
      - name: Test croisé avec le PHP du site
        run: TZ=Europe/Paris bash tests/interop/run.sh
      - name: Vérification statique
        run: luacheck DernierRempart
